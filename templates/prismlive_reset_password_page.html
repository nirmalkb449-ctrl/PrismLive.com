<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism Live | Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Poppins",sans-serif;min-height:100vh;background:#f4f6f9}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:35px 18px;background:linear-gradient(135deg,rgba(0,65,150,.96),rgba(23,102,175,.84),rgba(117,168,219,.9))}
.card{width:100%;max-width:470px;background:white;border-radius:14px;padding:45px;box-shadow:0 30px 80px rgba(0,35,90,.35)}
h1{font-size:27px;color:#174a82;margin-bottom:8px}.sub{font-size:11px;color:#8491a2;line-height:1.8;margin-bottom:25px}
label{display:block;color:#36516d;font-size:11px;font-weight:600;margin-bottom:7px}
input{width:100%;height:47px;border:1px solid #dbe4ed;border-radius:6px;padding:0 14px;margin-bottom:18px;font:11px Poppins;outline:none}
input:focus{border-color:#0876d9;box-shadow:0 0 0 3px rgba(8,118,217,.09)}
button{width:100%;height:47px;border:0;border-radius:6px;color:white;background:linear-gradient(90deg,#005dc8,#087ee0);font:700 11px Poppins;cursor:pointer}
.alert{padding:11px 13px;margin:0 0 16px;border-radius:6px;font-size:11px}.alert.error{background:#fff0f0;color:#a12c2c}.alert.success{background:#eaf8ef;color:#176b38}
@media(max-width:500px){.card{padding:32px 24px}h1{font-size:24px}}
</style>
</head>
<body><main class="page"><section class="card">
<h1>Create a New Password</h1><p class="sub">Choose a strong password with at least 8 characters, then confirm it below.</p>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}<div class="alert {{ category }}" role="alert">{{ message }}</div>{% endfor %}
{% endwith %}
<form method="POST" action="{{ url_for('reset_password', token=token) }}">
<label for="password">New password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Enter new password" required>
<label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" placeholder="Re-enter new password" required>
<button type="submit">Reset Password</button>
</form>
</section></main></body></html>
