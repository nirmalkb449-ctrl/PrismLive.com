<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrismLive</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #ffffff;
        }

        /* =========================
           HERO SECTION
        ========================== */

        .hero {
            position: relative;
            width: 100%;
            height: 700px;

            background-image: url("images/background02.jpg");
            background-size: cover;
            background-position: center center;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Blue overlay */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(0, 105, 215, 0.82);

            z-index: 1;
        }

        /* Content */
        .hero-content {
            position: relative;
            z-index: 2;

            text-align: center;
            color: white;

            padding: 20px;
        }

        .hero-content h1 {
            font-size: 68px;
            font-weight: 700;
            line-height: 1.1;

            margin-bottom: 15px;

            letter-spacing: -1px;
        }

        .hero-content p {
            font-size: 19px;
            font-weight: 300;

            letter-spacing: 0.1px;

            color: #ffffff;
        }


        /* =========================
           OPTIONAL BUTTON
        ========================== */

        .hero-button {
            display: inline-block;

            margin-top: 30px;
            padding: 12px 30px;

            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 30px;

            color: white;
            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            transition: 0.3s;
        }

        .hero-button:hover {
            background: white;
            color: #0874d9;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 768px) {
  .hero-buttons { flex-direction: column; width: 100%; }
  .hero-buttons button, .hero-buttons a { width: 100%; }
  h1 { font-size: 38px !important; line-height: 1.1 !important; }
}



    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-responsive.css') }}">
</head>


<body>

    <header class="flex justify-between items-center p-4">
  
  <!-- 1. LEFT: Logo -->
  <div>Prism Live</div>

  <!-- 2. MIDDLE: PC Menu - Phone il marayum -->
  <nav class="hidden md:flex gap-6">
    <a href="/">Home</a>
    <a href="/sponsors">Sponsors</a>
    <a href="/payment">Payment</a>
    <a href="/register">Register</a>
  </nav>

  <!-- 3. RIGHT: Hamburger - PC yil marayum, Phone il mathram kanum -->
  <button id="menuBtn" class="md:hidden text-3xl text-white">☰</button>

</header>

<!-- 4. Phone il click cheyyumbol thurakkunna Menu - Header nu THAZHE -->
<div id="mobileMenu" class="hidden flex-col bg-blue-900 p-5 gap-4">
  <a href="/">Home</a>
  <a href="/sponsors">Sponsors</a>
  <a href="/payment">Payment</a>
  <a href="/register">Register</a>
</div>

<script>
  document.getElementById('menuBtn').onclick = () => {
    document.getElementById('mobileMenu').classList.toggle('hidden');
    document.getElementById('mobileMenu').classList.toggle('flex');
  }
</script>
        <!-- HERO / BANNER -->

    <section class="hero">

        <div class="hero-content">

            <h1>PrismLive</h1>

            <p>
                Creative &amp; Social Responsibility &amp; Bussiness Support
            </p>
 
             <Optional>
        
            <a href="prismlive_home_page.html" class="hero-button">
                Welcome
            </a>
            

        </div>

    </section>


{% include 'partials/account_menu.html' %}
</body>
</html>
