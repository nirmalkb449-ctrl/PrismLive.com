<style>
.pl-account-float{position:fixed;z-index:9999;top:108px;right:2.8%;font-family:Arial,sans-serif;color:#333}
.pl-account-trigger{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#fff;cursor:pointer;font:600 13px Arial,sans-serif;text-shadow:0 1px 3px #123}
.pl-account-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#15599b;font-weight:700;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 8px #1235}
.pl-account-menu{display:none;position:absolute;right:0;top:48px;width:235px;background:#fff;border-radius:8px;box-shadow:0 8px 25px #0003;overflow:hidden;border:1px solid #e5e8ed}
.pl-account-menu.open{display:block}
.pl-account-head{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid #e8e8e8}
.pl-account-head .pl-account-avatar{width:54px;height:54px;flex:none;background:#eaf3ff;font-size:18px}
.pl-account-head strong{display:block;font-size:14px;color:#222}
.pl-account-head small{display:block;color:#777;font-size:11px;margin-top:4px;overflow-wrap:anywhere}
.pl-account-menu a,.pl-account-menu button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 16px;border:0;background:#fff;color:#444;text-decoration:none;text-align:left;font-size:13px;cursor:pointer}
.pl-account-menu a:hover,.pl-account-menu button:hover{background:#f3f7fc;color:#075bc7}
.pl-account-separator{border-top:1px solid #e8e8e8;margin-top:4px;padding-top:5px!important}
@media(max-width:700px){.pl-account-float{top:82px;right:14px}.pl-account-trigger>span:last-child{display:none}.pl-account-menu{width:220px}}
</style>
{% if logged_in and current_user %}
<div class="pl-account-float">
  <button class="pl-account-trigger" type="button" aria-label="Open account menu" aria-expanded="false" onclick="(function(b){var m=b.nextElementSibling;m.classList.toggle('open');b.setAttribute('aria-expanded',m.classList.contains('open'));})(this)">
    <span>{{ current_user.first_name }} {{ current_user.last_name }}</span>
    <span class="pl-account-avatar">{{ (current_user.first_name[:1] ~ current_user.last_name[:1])|upper }}</span>
  </button>
  <div class="pl-account-menu">
    <div class="pl-account-head"><span class="pl-account-avatar">{{ (current_user.first_name[:1] ~ current_user.last_name[:1])|upper }}</span><div><strong>{{ current_user.first_name }} {{ current_user.last_name }}</strong><small>{{ current_user.email }}</small></div></div>
    <a href="{{ url_for('profile') }}">♙ My Profile</a>
    <a href="{{ url_for('account_settings') }}">⚙ Account Settings</a>
    <a href="{{ url_for('my_projects') }}">▱ My Projects</a>
    <a href="{{ url_for('activity_history') }}">◷ Activity History</a>
    <form method="post" action="{{ url_for('logout') }}"><button class="pl-account-separator" type="submit">⇥ Sign Out</button></form>
  </div>
</div>
<script>
document.addEventListener('click',function(e){document.querySelectorAll('.pl-account-menu.open').forEach(function(m){if(!m.parentElement.contains(e.target)){m.classList.remove('open');var b=m.parentElement.querySelector('.pl-account-trigger');if(b)b.setAttribute('aria-expanded','false');}});});
</script>
{% endif %}
